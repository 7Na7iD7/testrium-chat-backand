[workspace]
resolver = "2"
members = [
    "crates/chat-domain",
    "crates/chat-infra",
    "crates/chat-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Navid Afzali", "Niki Farzami"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
jsonwebtoken = "9"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"
dashmap = "6"

chat-domain = { path = "crates/chat-domain" }
chat-infra = { path = "crates/chat-infra" }
