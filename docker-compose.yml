version: "3.8"

services:
  chat-db:
    image: postgres:16
    container_name: testrium-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD}
      POSTGRES_DB: testrium_chat
    volumes:
      - chat_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testrium-chat-server
    restart: unless-stopped
    depends_on:
      chat-db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      CHAT_DATABASE_URL: postgres://postgres:${CHAT_DB_PASSWORD}@chat-db:5432/testrium_chat
    ports:
      - "127.0.0.1:9090:9090"

  redis:
    image: redis:7-alpine
    container_name: testrium-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    network_mode: host
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: testrium-livekit
    restart: unless-stopped
    depends_on:
      - redis
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

  livekit-egress:
    image: livekit/egress:latest
    container_name: testrium-livekit-egress
    restart: unless-stopped
    depends_on:
      - redis
      - livekit
    network_mode: host
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml:ro
    cap_add:
      - CAP_SYS_ADMIN
    shm_size: 2gb

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: testrium-pg-exporter
    restart: unless-stopped
    depends_on:
      chat-db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${CHAT_DB_PASSWORD}@chat-db:5432/testrium_chat?sslmode=disable"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: testrium-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  prometheus:
    image: prom/prometheus:latest
    container_name: testrium-prometheus
    restart: unless-stopped
    depends_on:
      - alertmanager
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9091:9090"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: testrium-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:latest
    container_name: testrium-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://chat.testrium.ir/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  chat_db_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
