# قبل از فعال‌سازی این فایل، YOUR-UNIVERSITY-DOMAIN رو با ساب‌دامینی که
# دانشگاه بهت می‌ده جایگزین کن، سپس:
#   sudo ln -s /etc/nginx/sites-available/testrium-supabase.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d supabase.YOUR-UNIVERSITY-DOMAIN -d supabase-studio.YOUR-UNIVERSITY-DOMAIN
#   sudo nginx -t && sudo systemctl reload nginx

# ── API اصلی (Kong) — همینی که فلاتر و chat-infra بهش وصل می‌شن ──
server {
    listen 80;
    server_name supabase.YOUR-UNIVERSITY-DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name supabase.YOUR-UNIVERSITY-DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/supabase.YOUR-UNIVERSITY-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase.YOUR-UNIVERSITY-DOMAIN/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # برای Realtime (WebSocket) — تب آمار/تحلیل زنده‌ی استاد از این استفاده می‌کنه
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}

# ── Studio — دسترسی مدیریتی کامل به دیتابیس، محدودش کن ──
server {
    listen 80;
    server_name supabase-studio.YOUR-UNIVERSITY-DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name supabase-studio.YOUR-UNIVERSITY-DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/supabase-studio.YOUR-UNIVERSITY-DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supabase-studio.YOUR-UNIVERSITY-DOMAIN/privkey.pem;

    # پیشنهاد: به IP خودت محدودش کن
    # allow 1.2.3.4;
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
