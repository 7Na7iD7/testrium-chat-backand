services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: supabase-pg-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?sslmode=disable"
    ports:
      - "0.0.0.0:9187:9187"
